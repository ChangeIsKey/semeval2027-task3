[project]
name = "semeval2027-task3"
version = "0.1.0"
description = "SemEval-2027 Task 3: Lexical Semantic Change Across Multiple Time Periods"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "bcubed>=1.5",
    "tqdm>=4.65.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
